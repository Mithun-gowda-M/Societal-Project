<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="rubyGlow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF4D5E" />
      <stop offset="45%" stop-color="#C1121F" />
      <stop offset="90%" stop-color="#780000" />
      <stop offset="100%" stop-color="#3A0005" />
    </radialGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#FF859B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF3347" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#C1121F" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="30" fill="#09090D" />
  <circle cx="32" cy="32" r="28" fill="#160508" stroke="rgba(255,51,71,0.25)" stroke-width="1.5" />
  
  <!-- Glossy Blood Drop Silhouette -->
  <path d="M 32 10 
           C 32 10, 18 28, 18 39 
           C 18 47.8 24.2 54 32 54 
           C 39.8 54, 46 47.8, 46 39 
           C 46 28, 32 10, 32 10 Z" 
        fill="url(#rubyGlow)" 
        filter="url(#dropShadow)" />
        
  <!-- Specular 3D Reflection Curve -->
  <path d="M 32 14 
           C 30 18, 23 29, 23 38 
           C 23 42.5 25.5 46.5 29 48
           C 27 46 25 42 25 38
           C 25 30 31 18 32 14 Z" 
        fill="url(#highlight)" />
        
  <!-- Tiny Light Glint -->
  <circle cx="28" cy="27" r="2.5" fill="#FFFFFF" opacity="0.9" />
</svg>
