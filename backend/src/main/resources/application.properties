spring.application.name=bloodconnect-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bloodconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

bloodconnect.jwt.secret=${JWT_SECRET}
bloodconnect.jwt.expiration=${JWT_EXPIRATION:PT1H}
bloodconnect.otp.expiration=${OTP_EXPIRATION:PT10M}
bloodconnect.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:PT1M}
bloodconnect.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
bloodconnect.otp.max-resends=${OTP_MAX_RESENDS:3}
bloodconnect.sendgrid.api-key=${SENDGRID_API_KEY:}
bloodconnect.sendgrid.from-email=${SENDGRID_FROM_EMAIL:dispatch@bloodconnect.health}
bloodconnect.official.mail=${OFFICIAL_MAIL:dispatch@bloodconnect.health}
bloodconnect.official.sms-sender=${SMS_SENDER_ID:VM-BLDCON}
bloodconnect.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
bloodconnect.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
bloodconnect.twilio.from-number=${TWILIO_FROM_NUMBER:+15005550006}
bloodconnect.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500}
bloodconnect.admin.email=${BLOODCONNECT_ADMIN_EMAIL:admin@bloodconnect.local}
bloodconnect.admin.password=${BLOODCONNECT_ADMIN_PASSWORD:BMMCGS5353@m}
bloodconnect.seed-test-accounts=${SEED_TEST_ACCOUNTS:false}
